<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Verification — TrevVote Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .success-page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }
      .success-card {
        width: min(100%, 760px);
        border: 1px solid var(--ink, #1d1c1c);
        border-radius: 28px;
        padding: clamp(28px, 5vw, 56px);
        background: var(--yellow, #fff48d);
        box-shadow: var(--shadow, 0 22px 70px rgba(29, 28, 28, 0.12));
      }
      .success-card h1 {
        margin: 16px 0;
        color: var(--ink, #1d1c1c);
        font-size: clamp(3rem, 8vw, 6.5rem);
        line-height: 0.82;
        letter-spacing: -0.1em;
        text-transform: uppercase;
      }
      .success-card p {
        color: var(--muted, rgba(29, 28, 28, 0.62));
        line-height: 1.65;
        font-size: 1.05rem;
      }
      .success-meta {
        display: grid;
        gap: 10px;
        margin: 26px 0;
      }
      .success-meta div {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        border-bottom: 1px solid rgba(29, 28, 28, 0.18);
        padding-bottom: 10px;
      }
      .success-meta span {
        color: var(--muted, rgba(29, 28, 28, 0.62));
      }
      .success-meta strong {
        color: var(--ink, #1d1c1c);
        text-align: right;
      }
      .success-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <main class="success-page">
      <section class="success-card">
        <p class="eyebrow-text">Payment verification</p>
        <h1 id="title">Checking payment...</h1>
        <p id="message">Please wait while the backend verifies your payment reference with the gateway.</p>
        <div class="success-meta">
          <div><span>Reference</span><strong id="reference">—</strong></div>
          <div><span>Status</span><strong id="status">Checking</strong></div>
          <div><span>Contestant</span><strong id="contestant">—</strong></div>
          <div><span>Votes purchased</span><strong id="votes">—</strong></div>
          <div><span>Amount paid</span><strong id="amount">—</strong></div>
          <div><span>Date/time</span><strong id="dateTime">—</strong></div>
          <div><span>Voter</span><strong id="voter">—</strong></div>
          <div><span>Gateway</span><strong id="gateway">—</strong></div>
        </div>
        <div class="success-actions">
          <a class="primary-btn" href="leaderboard.html">Back to leaderboard</a>
          <a class="secondary-btn" href="contestants.html">Vote again</a>
          <button class="secondary-btn" type="button" id="retryBtn">Verify again</button>
        </div>
      </section>
    </main>

    <script src="config.js"></script>
    <script>
      const API_BASE = window.TREV_VOTE_API_BASE || window.location.origin || "http://127.0.0.1:8000";
      const params = new URLSearchParams(window.location.search);
      const reference = params.get("reference");
      const formatter = new Intl.NumberFormat("en-NG", { style: "currency", currency: "NGN", maximumFractionDigits: 0 });

      document.getElementById("reference").textContent = reference || "Missing reference";

      async function verify() {
        if (!reference) {
          document.getElementById("title").textContent = "No reference found";
          document.getElementById("message").textContent = "The payment gateway did not return a transaction reference.";
          document.getElementById("status").textContent = "Missing";
          return;
        }

        document.getElementById("title").textContent = "Checking payment...";
        document.getElementById("status").textContent = "Checking";
        try {
          const response = await fetch(`${API_BASE}/api/payments/verify/${encodeURIComponent(reference)}`);
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Could not verify payment");

          const successful = result.status === "successful" || result.status === "verified";
          document.getElementById("title").textContent = successful ? "Votes credited." : "Verification pending.";
          document.getElementById("message").textContent = successful
            ? "Your bank transfer has been verified and the votes have been added."
            : "Your transfer details have been submitted. Admin will verify the bank transfer before votes are credited.";
          document.getElementById("status").textContent = result.status || "pending";
          document.getElementById("contestant").textContent = result.contestant || "—";
          document.getElementById("votes").textContent = result.votes ? new Intl.NumberFormat("en-NG").format(result.votes) : "—";
          document.getElementById("amount").textContent = result.amount ? formatter.format(result.amount) : "—";
          const dateValue = result.processedAt || result.createdAt;
          document.getElementById("dateTime").textContent = dateValue ? new Date(dateValue).toLocaleString("en-NG") : "—";
          document.getElementById("voter").textContent = result.voter || "—";
          document.getElementById("gateway").textContent = result.gateway || "Bank Transfer";
        } catch (error) {
          document.getElementById("title").textContent = "Verification failed";
          document.getElementById("message").textContent = error.message;
          document.getElementById("status").textContent = "Error";
        }
      }

      document.getElementById("retryBtn").addEventListener("click", verify);
      verify();
    </script>
  </body>
</html>
